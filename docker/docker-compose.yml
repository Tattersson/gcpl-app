services:
  postgres:
    image: postgres:16-alpine
    container_name: gcpl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gcpl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gcpl_secret}
      POSTGRES_DB: ${POSTGRES_DB:-gcpl_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gcpl_pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gcpl} -d ${POSTGRES_DB:-gcpl_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: gcpl-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-gcpl}:${POSTGRES_PASSWORD:-gcpl_secret}@postgres:5432/${POSTGRES_DB:-gcpl_db}
      AUTH_SECRET: ${AUTH_SECRET:-gcpl-super-secret-jwt-key-change-in-production}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "${APP_PORT:-3000}:3000"

  # Optional local Keycloak server for testing (--profile keycloak)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: gcpl-keycloak
    profiles:
      - keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

volumes:
  gcpl_pgdata:
